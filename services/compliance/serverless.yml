service: compliance-tracker-api
frameworkVersion: '3'
useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: ca-west-1
  stage: prod
  memorySize: 256
  timeout: 15
  environment:
    NODE_ENV: production
    DYNAMO_TABLE: ${env:DYNAMO_TABLE, 'compliance-tracker-prod'}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'http://localhost:5173'}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, '"ClearComply Compliance Bot" <noreply@maidlink.ca>'}
    SES_CONFIG_SET: ${env:SES_CONFIG_SET, ''}
    UPLOAD_BUCKET: ${env:UPLOAD_BUCKET, 'compliance-tracker-uploads-prod-946839354953'}
    COMPLIANCE_USERNAME: ${ssm:/compliance-tracker/prod/compliance-username}
    COMPLIANCE_PASSWORD: ${ssm:/compliance-tracker/prod/compliance-password}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:TransactWriteItems
          Resource:
            - arn:aws:dynamodb:ca-west-1:*:table/${env:DYNAMO_TABLE, 'compliance-tracker-prod'}
            - arn:aws:dynamodb:ca-west-1:*:table/${env:DYNAMO_TABLE, 'compliance-tracker-prod'}/index/*
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource:
            - arn:aws:ses:us-east-1:946839354953:identity/maidlink.ca
            - arn:aws:ses:us-east-1:946839354953:configuration-set/MaidlinkConfigSet-prod
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${env:UPLOAD_BUCKET, 'compliance-tracker-uploads-prod-946839354953'}/*
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
            - arn:aws:bedrock:*:*:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0

resources:
  Resources:
    ComplianceTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${env:DYNAMO_TABLE, 'compliance-tracker-prod'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: entityType
            AttributeType: S
          - AttributeName: name
            AttributeType: S
          - AttributeName: subId
            AttributeType: S
          - AttributeName: projectId
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1-entityType-name
            KeySchema:
              - AttributeName: entityType
                KeyType: HASH
              - AttributeName: name
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2-subId-projectId
            KeySchema:
              - AttributeName: subId
                KeyType: HASH
              - AttributeName: projectId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Uploaded COI/W-9/Payroll/Workforce documents. Notification wired
    # manually (rather than via serverless's built-in `s3` function event)
    # because the bucket is an explicit resource with a fixed name, not one
    # serverless creates and owns itself.
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:UPLOAD_BUCKET, 'compliance-tracker-uploads-prod-946839354953'}
        NotificationConfiguration:
          LambdaConfigurations:
            - Event: s3:ObjectCreated:*
              Function: !GetAtt ProcessUploadedDocumentLambdaFunction.Arn

    UploadsBucketInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt ProcessUploadedDocumentLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: s3.amazonaws.com
        SourceArn: arn:aws:s3:::${env:UPLOAD_BUCKET, 'compliance-tracker-uploads-prod-946839354953'}
        SourceAccount: !Ref AWS::AccountId

functions:
  # --- read endpoints ---
  listSubcontractors:
    handler: src/handlers/listSubcontractors.handler
    events:
      - http:
          path: /subcontractors
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  getSubcontractor:
    handler: src/handlers/getSubcontractor.handler
    events:
      - http:
          path: /subcontractors/{subId}
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  getDocumentViewUrl:
    handler: src/handlers/getDocumentViewUrl.handler
    events:
      - http:
          path: /subcontractors/{subId}/documents/view-url
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  listProjects:
    handler: src/handlers/listProjects.handler
    events:
      - http:
          path: /projects
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  getProjectStatus:
    handler: src/handlers/getProjectStatus.handler
    events:
      - http:
          path: /projects/{projectId}/status
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  listMissingDocuments:
    handler: src/handlers/listMissingDocuments.handler
    events:
      - http:
          path: /missing-documents
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  # --- document submission (re-enters AI validation) ---
  submitSubDocument:
    handler: src/handlers/submitSubDocument.handler
    events:
      - http:
          path: /subcontractors/{subId}/documents/{docType}/submit
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  submitProjectDocument:
    handler: src/handlers/submitProjectDocument.handler
    events:
      - http:
          path: /projects/{projectId}/subcontractors/{subId}/documents/{docType}/submit
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  # --- cascade checks (real SES send) ---
  runSubCascadeCheck:
    handler: src/handlers/runSubCascadeCheck.handler
    events:
      - http:
          path: /subcontractors/{subId}/run-cascade-check
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  runProjectCascadeCheck:
    handler: src/handlers/runProjectCascadeCheck.handler
    events:
      - http:
          path: /projects/{projectId}/subcontractors/{subId}/run-cascade-check
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  # --- human actions (never automatic) ---
  suspendSubOnboarding:
    handler: src/handlers/suspendSubOnboarding.handler
    events:
      - http:
          path: /subcontractors/{subId}/suspend
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  reinstateSubOnboarding:
    handler: src/handlers/reinstateSubOnboarding.handler
    events:
      - http:
          path: /subcontractors/{subId}/reinstate
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  withholdPayment:
    handler: src/handlers/withholdPayment.handler
    events:
      - http:
          path: /projects/{projectId}/subcontractors/{subId}/withhold-payment
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  releasePayment:
    handler: src/handlers/releasePayment.handler
    events:
      - http:
          path: /projects/{projectId}/subcontractors/{subId}/release-payment
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  suspendSubcontractor:
    handler: src/handlers/suspendSubcontractor.handler
    events:
      - http:
          path: /projects/{projectId}/subcontractors/{subId}/suspend
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  reinstateSubcontractor:
    handler: src/handlers/reinstateSubcontractor.handler
    events:
      - http:
          path: /projects/{projectId}/subcontractors/{subId}/reinstate
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  # --- sub-facing portal (per-subcontractor Basic Auth, not the compliance login) ---
  getSubPortalProfile:
    handler: src/handlers/getSubPortalProfile.handler
    events:
      - http:
          path: /sub-portal/{subId}
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  requestSubUploadUrl:
    handler: src/handlers/requestSubUploadUrl.handler
    events:
      - http:
          path: /sub-portal/{subId}/documents/{docType}/upload-url
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  requestProjectUploadUrl:
    handler: src/handlers/requestProjectUploadUrl.handler
    events:
      - http:
          path: /sub-portal/{subId}/projects/{projectId}/documents/{docType}/upload-url
          method: post
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  getSubPortalDocumentViewUrl:
    handler: src/handlers/getSubPortalDocumentViewUrl.handler
    events:
      - http:
          path: /sub-portal/{subId}/documents/view-url
          method: get
          cors:
            origin: "${env:CORS_ORIGIN, 'http://localhost:5173'}"
            headers: [Content-Type, Authorization]

  # --- S3-triggered: reads the uploaded file, sends it to Claude via Bedrock for
  # field extraction, then runs the same validation logic submitSubDocument uses ---
  processUploadedDocument:
    handler: src/handlers/processUploadedDocument.handler
    timeout: 30
    memorySize: 512

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3101
    host: localhost
    noPrependStageInUrl: true
    dotenv: ../../.env
